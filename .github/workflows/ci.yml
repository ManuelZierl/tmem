name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.12", "3.14"]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Linux shell dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes fzf zsh
      - name: Install macOS UI dependency
        if: runner.os == 'macOS'
        run: brew install fzf
      - name: Install Windows UI dependency
        if: runner.os == 'Windows'
        run: choco install fzf --yes --no-progress
      - name: Install project
        run: python -m pip install -e ".[dev]"
      - name: Test
        run: python -m unittest discover -s tests -v
      - name: Bash syntax
        if: runner.os != 'Windows'
        run: bash -n shell/tmem.bash install.sh uninstall.sh

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - run: python -m pip install build
      - run: python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/*
          retention-days: 7
