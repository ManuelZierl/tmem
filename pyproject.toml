[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "tmem"
version = "0.1.0"
description = "Persistent, fuzzy-searchable terminal command memory for Bash"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "tmem contributors"}]
dependencies = []

[project.optional-dependencies]
dev = [
    "build>=1.2",
    "pexpect>=4.9",
]

[project.urls]
Homepage = "https://github.com/ManuelZierl/tmem"
Repository = "https://github.com/ManuelZierl/tmem.git"
Issues = "https://github.com/ManuelZierl/tmem/issues"

[project.scripts]
tmem-core = "tmem.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
